# The Python package's wheels and its source distribution, and their upload to PyPI (docs/python.md, "Wheels and
# PyPI"). `pip install fminus` then takes seconds: a wheel holds the extension module built, with FMinus, its runtime
# and LLVM linked into it.
#
# Each build job runs cibuildwheel (configured in pyproject.toml, [tool.cibuildwheel]) on one platform: a wheel for each
# CPython the package supports, each a whole build of FMinus (pip's own, pyproject.toml), installed and tested with
# python/tests/. The sdist job packs the source distribution. The publish job uploads the run's wheels and sdist with
# PyPI's Trusted Publishing: PyPI takes GitHub's word for which workflow is uploading, so no token is stored. Its
# publisher is set up once on PyPI (and on TestPyPI): this repository, the workflow wheels.yml, the environment pypi
# (or testpypi).
#
# Run by hand (Actions > Wheels > Run workflow). "publish" says where the files go: nowhere (the default: they are
# the run's artifacts, 7 days), TestPyPI or PyPI, on main only. PyPI keeps a version's files for good, so raise the
# version (CMakeLists.txt's project(FMinus VERSION ...)) before each upload there.
#
# LLVM comes from the deps cache, as for every build (FMINUS_DEPS_DIR), kept between runs by actions/cache under a key
# of the pins and the modules that build the dependencies. A change to one of those starts from the platform's last
# cache all the same (restore-keys): the build takes the LLVM in it if it is still the flavor it asks for, and the
# cache is saved again under the new key. With no LLVM of the pinned version in the cache:
#   Linux           builds LLVM, Bison and Flex in cibuildwheel's manylinux container, with the image's own clang
#                   (FMinus's runtime needs clang; GCC is the image's compiler): about 40 minutes on GitHub's runner,
#                   once per pin. The Deps workflow's linux-x64 archive does not do here: it is built on Arch Linux,
#                   against a newer C library than manylinux allows a wheel.
#   macOS, Windows  unpacks the Deps workflow's archive for the platform (the release deps-llvm-<version>), whose
#                   LLVM is the flavor this build asks for. Without one, the build makes its own, as on Linux.
# On Windows the job runs in Visual Studio's developer environment, as deps.yml's does.
#
# Each action is pinned to its release's full commit SHA, with the tag in a comment (as in pages.yml).
name: Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the wheels and the sdist (on main only)"
        type: choice
        options: [nowhere, testpypi, pypi]
        default: nowhere
      platforms:
        description: "Build only these (space-separated: linux-x64 linux-arm64 macos-arm64 windows-x64); empty: all but linux-arm64"
        type: string
        default: ""
      pythons:
        description: "Build only these (cibuildwheel's selector: cp312-* for a quick try); empty: every CPython the package supports"
        type: string
        default: ""

# nothing by default; each job asks for what it needs
permissions: {}

# one run at a time per branch and choice of platforms
concurrency:
  group: wheels-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # linux-arm64 only when named: FMinus has not been built on Linux on arm64 before
          all='[{"platform": "linux-x64", "os": "ubuntu-latest", "default": true},
                {"platform": "linux-arm64", "os": "ubuntu-24.04-arm", "default": false},
                {"platform": "macos-arm64", "os": "macos-latest", "default": true},
                {"platform": "windows-x64", "os": "windows-latest", "default": true}]'
          matrix=$(jq -c --arg p "$PLATFORMS" \
            '($p | split(" ") | map(select(. != ""))) as $want
             | [.[] | select(.platform as $x | if ($want | length) == 0 then .default else ($want | index($x)) != null end)
                    | del(.default)]' <<< "$all")
          [ "$matrix" != "[]" ] || { echo "no platform named '$PLATFORMS'"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  wheels:
    needs: plan
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Visual Studio's developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clang = 'Microsoft.VisualStudio.Component.VC.Llvm.Clang'
          $vs = & $vswhere -latest -products * -requires $clang -property installationPath
          if (-not $vs) { throw "no Visual Studio with its C++ Clang tools" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      # The deps cache, outside the checkout (cibuildwheel copies the checkout into its container). On Linux the
      # build runs in the container, which sees the runner's files under /host.
      - name: Deps cache (where)
        id: deps
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/fminus-deps"
          mkdir -p "$dir/install"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = Linux ]; then
            echo "FMINUS_DEPS_DIR=/host$dir" >> "$GITHUB_ENV"
          else
            echo "FMINUS_DEPS_DIR=$dir" >> "$GITHUB_ENV"
          fi

      - name: Deps cache (restore)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.deps.outputs.dir }}/install
          key: wheels-deps-${{ matrix.platform }}-${{ hashFiles('cmake/FMinusPins.cmake', 'cmake/FMinusLLVM.cmake', 'cmake/FMinusParserTools.cmake') }}
          restore-keys: wheels-deps-${{ matrix.platform }}-

      - name: Prebuilt dependencies (macOS, Windows; the Deps workflow's)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Linux'
        continue-on-error: true   # without them, the build makes its own
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: ${{ steps.deps.outputs.dir }}
        run: |
          version=$(sed -nE 's/^set\(FMINUS_LLVM_VERSION "([^"]+)"\).*/\1/p' "$GITHUB_WORKSPACE/cmake/FMinusPins.cmake")
          if ls install/llvm-"$version"-*/fminus-flavor.cmake >/dev/null 2>&1; then
            echo "the cache restored has an LLVM $version:"; ls install; exit 0
          fi
          name="fminus-deps-llvm-${version}-${{ matrix.platform }}"
          gh release download "deps-llvm-${version}" --pattern "$name.tar.gz" --pattern "$name.tar.gz.sha256"
          if command -v sha256sum >/dev/null; then sha256sum -c "$name.tar.gz.sha256"; else shasum -a 256 -c "$name.tar.gz.sha256"; fi
          tar -xzf "$name.tar.gz" -C install   # relative: Git Bash's tar takes D:\... for a remote host
          rm "$name.tar.gz" "$name.tar.gz.sha256"
          ls install

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: ${{ inputs.pythons }}   # empty: every build pyproject.toml leaves in

      # Kept whether or not the wheels built, once LLVM is whole in it: the next run then starts from it.
      - name: Deps cache (is LLVM in it?)
        id: built
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: |
          if ls "${{ steps.deps.outputs.dir }}"/install/llvm-*/fminus-flavor.cmake >/dev/null 2>&1; then
            echo "llvm=true" >> "$GITHUB_OUTPUT"
          fi
          ls "${{ steps.deps.outputs.dir }}/install" || true

      - name: Deps cache (save)
        if: always() && steps.built.outputs.llvm == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.deps.outputs.dir }}/install
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          retention-days: 7
          compression-level: 0   # a wheel is a zip already
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the source distribution
        run: |
          pipx run build --sdist
          pipx run twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    if: inputs.publish != 'nowhere' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish }}   # pypi or testpypi: the one its trusted publisher names
    permissions:
      id-token: write   # Trusted Publishing: GitHub's token for this run, which PyPI checks
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true   # every artifact of the run: each platform's wheels, and the sdist

      - run: ls -l dist

      - name: Upload to TestPyPI
        if: inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Upload to PyPI
        if: inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
