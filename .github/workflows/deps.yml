# FMinus's built dependencies, prebuilt once per platform, so a build elsewhere can unpack them instead of building
# LLVM (10-30 minutes on a fast machine, hours on a hosted runner).
#
# Each build job configures the release preset, which builds the pinned LLVM (Release, without assertions: the release
# preset's flavor), Bison and Flex (WinFlexBison on Windows) into the deps cache (.deps/). It then builds FMinus and
# runs its tests against them, and packs the cache's installs (.deps/install/<name>/) as one archive per platform:
# fminus-deps-llvm-<version>-<platform>.tar.gz, beside its SHA-256. Unpacked into another checkout's .deps/install/,
# the release preset finds its flavor there and builds nothing; so do projects that read FMinus's deps cache.
#
# Run by hand (Actions > Deps > Run workflow), for every platform or the ones named in "platforms". On main, with
# "publish" ticked (the default), the publish job puts the run's archives on the pre-release deps-llvm-<version>, never
# marked as the latest release, replacing any archives of the same name (the other platforms' stay). A run on another
# branch only keeps them as the run's artifacts (7 days).
# On Windows the jobs run in Visual Studio's developer environment, as FMinus's build is meant to (an "x64 Native Tools"
# prompt): LLVM's BLAKE3 assembles with ml64, which only that environment puts on the PATH.
# Linux builds in an Arch Linux container (archlinux:base-devel); its static libraries suit a machine with the same
# or a newer toolchain.
#
# Each action is pinned to its release's full commit SHA, with the tag in a comment (as in pages.yml).
name: Deps

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the archives on the release deps-llvm-<version> (on main only)"
        type: boolean
        default: true
      platforms:
        description: "Build only these (space-separated: macos-arm64 windows-x64 linux-x64); empty: all"
        type: string
        default: ""

# nothing by default; each job asks for what it needs
permissions: {}

# one run at a time per branch and choice of platforms
concurrency:
  group: deps-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[{"platform": "macos-arm64", "os": "macos-latest"},
                {"platform": "windows-x64", "os": "windows-latest"},
                {"platform": "linux-x64", "os": "ubuntu-latest", "container": "archlinux:base-devel"}]'
          matrix=$(jq -c --arg p "$PLATFORMS" \
            '[.[] | select(.platform as $x | ($p | split(" ") | map(select(. != ""))) as $want
                             | ($want | length) == 0 or ($want | index($x)) != null)]' <<< "$all")
          [ "$matrix" != "[]" ] || { echo "no platform named '$PLATFORMS'"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    needs: plan
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages (Arch Linux)
        if: runner.os == 'Linux'
        run: pacman -Syu --noconfirm --needed git clang lld cmake ninja python m4

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Visual Studio's developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clang = 'Microsoft.VisualStudio.Component.VC.Llvm.Clang'
          $vs = & $vswhere -latest -products * -requires $clang -property installationPath
          if (-not $vs) { throw "no Visual Studio with its C++ Clang tools" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Configure (builds LLVM, Bison and Flex into .deps)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"   # the container runs as root
            export CC=clang CXX=clang++
          fi
          cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Pack
        id: pack
        run: |
          version=$(sed -nE 's/^set\(FMINUS_LLVM_VERSION "([^"]+)"\).*/\1/p' cmake/FMinusPins.cmake)
          [ -n "$version" ] || { echo "no FMINUS_LLVM_VERSION in cmake/FMinusPins.cmake"; exit 1; }
          name="fminus-deps-llvm-${version}-${{ matrix.platform }}"
          cd .deps/install
          dirs=()
          for d in */; do dirs+=("${d%/}"); done
          printf 'packing %s\n' "${dirs[@]}"
          ls -d llvm-"$version"-Release-* >/dev/null   # the release preset's flavor must be among them
          for d in llvm-*; do
            [ -d "$d" ] || continue
            [ -f "$d/fminus-flavor.cmake" ] || { echo "$d is not whole (no fminus-flavor.cmake)"; exit 1; }
          done
          export COPYFILE_DISABLE=1                     # macOS: no ._ files for extended attributes
          tar -czf "../../$name.tar.gz" "${dirs[@]}"   # relative: Git Bash's tar takes D:\... for a remote host
          cd ../..
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi \
            > "$name.tar.gz.sha256"
          ls -l "$name.tar.gz"; cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.name }}.tar.gz
            ${{ steps.pack.outputs.name }}.tar.gz.sha256
          retention-days: 7
          compression-level: 0   # already gzipped
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release and its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fminus-deps-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l
          shopt -s nullglob
          files=(fminus-deps-llvm-*.tar.gz)
          [ ${#files[@]} -gt 0 ] || { echo "no archives"; exit 1; }
          version=$(echo "${files[0]}" | sed -nE 's/^fminus-deps-llvm-([0-9.]+)-.*/\1/p')
          tag="deps-llvm-${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes="FMinus's built dependencies for LLVM ${version}: LLVM (Release, without assertions: the release"
            notes+=" preset's flavor), Bison and Flex (WinFlexBison on Windows), one archive per platform, each with"
            notes+=" its SHA-256. Unpack one into a checkout's .deps/install/ to skip building them."
            notes+=" Made by .github/workflows/deps.yml."
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Prebuilt dependencies: LLVM ${version}" --notes "$notes" \
              || gh release view "$tag" >/dev/null   # another run made it meanwhile
          fi
          gh release upload "$tag" fminus-deps-llvm-*.tar.gz fminus-deps-llvm-*.tar.gz.sha256 --clobber
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
